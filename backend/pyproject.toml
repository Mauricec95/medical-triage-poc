[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-triage-backend"
version = "0.1.0"
description = "Backend for medical secretariat triage POC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "sqlmodel>=0.0.16,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "openai>=1.14,<2",
    "pdfplumber>=0.11,<1",
    "pytesseract>=0.3.10,<1",
    "Pillow>=10,<11",
    "python-multipart>=0.0.9,<1",
    "aiofiles>=23,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
